<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Real-Time Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">💬</div>
      <h2>Welcome Back</h2>
      <p>Enter your credentials to access your account</p>
    </div>

    <div class="auth-fields">
      <div class="field-group">
        <label for="login-identifier">Username or Email</label>
        <input 
          type="text" 
          id="login-identifier" 
          class="input-field" 
          placeholder="Enter username or email" 
          autofocus 
        />
      </div>

      <div class="field-group">
        <label for="login-password">Password</label>
        <input 
          type="password" 
          id="login-password" 
          class="input-field" 
          placeholder="••••••••" 
        />
      </div>

      <button id="login-btn" class="btn btn-primary" onclick="submitLogin()">Log In</button>
    </div>

    <div id="feedback" class="auth-feedback hidden"></div>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Sign up</a>
    </div>
  </div>

  <script src="vendor/ably.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/socket-shim.js"></script>
  <script>
    let socket = null;

    function showFeedback(msg, isError = true) {
      const fb = document.getElementById("feedback");
      fb.textContent = msg;
      fb.className = `auth-feedback ${isError ? 'error' : 'success'}`;
      fb.classList.remove("hidden");
    }

    function initSocket() {
      socket = createChatSocket();

      socket.onopen = () => {
        const fb = document.getElementById("feedback");
        if (fb.classList.contains("error")) {
          fb.classList.add("hidden");
        }
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.action === "auth_error") {
          showFeedback(data.text, true);
        } else if (data.action === "login_success") {
          sessionStorage.setItem("chat_user", JSON.stringify(data.user));
          showFeedback("Login successful! Redirecting...", false);
          setTimeout(() => {
            window.location.href = "chat.html";
          }, 800);
        }
      };

      socket.onerror = () => {
        showFeedback("Could not connect to the chat server.", true);
      };

      socket.onclose = () => {
        showFeedback("Connection lost. Please refresh the page.", true);
      };
    }

    function submitLogin() {
      const identifier = document.getElementById("login-identifier").value.trim();
      const password = document.getElementById("login-password").value;

      if (!identifier || !password) {
        showFeedback("Please enter both username/email and password.", true);
        return;
      }

      if (!socket || socket.readyState !== WebSocket.OPEN) {
        showFeedback("Connecting to server, please try again in a moment...", true);
        initSocket();
        return;
      }

      socket.send(JSON.stringify({
        action: "login",
        identifier: identifier,
        password: password
      }));
    }

    document.getElementById("login-identifier").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("login-password").focus();
    });

    document.getElementById("login-password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitLogin();
    });

    window.addEventListener("DOMContentLoaded", initSocket);
  </script>
</body>
</html>
