<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Real-Time Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">💬</div>
      <h2>Welcome Back</h2>
      <p>Enter your credentials to access your account</p>
    </div>

    <form id="login-form" novalidate>
      <div class="auth-fields">
        <div class="field-group">
          <label for="login-identifier">Username or Email</label>
          <input 
            type="text" 
            id="login-identifier" 
            name="identifier"
            class="input-field" 
            placeholder="Enter username or email" 
            autocomplete="username"
            autofocus 
          />
        </div>

        <div class="field-group">
          <label for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            name="password"
            class="input-field" 
            placeholder="••••••••" 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary">Log In</button>
      </div>
    </form>

    <div id="feedback" class="auth-feedback hidden"></div>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Sign up</a>
    </div>
  </div>

  <script src="vendor/ably.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/socket-shim.js"></script>
  <script>
    let socket = null;

    function showFeedback(msg, isError = true) {
      const fb = document.getElementById("feedback");
      fb.textContent = msg;
      fb.className = `auth-feedback ${isError ? 'error' : 'success'}`;
      fb.classList.remove("hidden");
    }

    function handleLoginError(customMsg) {
      // Explicit error message requirement
      const errorMsg = customMsg || "Username or password is wrong";
      showFeedback(errorMsg, true);

      // Re-enable button
      const btn = document.getElementById("login-btn");
      if (btn) btn.disabled = false;

      // Keep the username/email intact; clear and focus only the password input
      const pwInput = document.getElementById("login-password");
      if (pwInput) {
        pwInput.value = "";
        pwInput.focus();
      }
    }

    function initSocket() {
      try {
        if (typeof createChatSocket === "function") {
          socket = createChatSocket();
        } else {
          socket = new WebSocket("ws://127.0.0.1:8765");
        }

        socket.onopen = () => {
          const fb = document.getElementById("feedback");
          if (fb && fb.classList.contains("error")) {
            fb.classList.add("hidden");
          }
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.action === "auth_error") {
              handleLoginError("Username or password is wrong");
            } else if (data.action === "login_success") {
              sessionStorage.setItem("chat_user", JSON.stringify(data.user));
              showFeedback("Login successful! Redirecting...", false);
              setTimeout(() => {
                window.location.href = "chat.html";
              }, 600);
            }
          } catch (err) {
            console.error("Message parse error:", err);
          }
        };

        socket.onerror = () => {
          const btn = document.getElementById("login-btn");
          if (btn) btn.disabled = false;
        };

        socket.onclose = () => {
          const btn = document.getElementById("login-btn");
          if (btn) btn.disabled = false;
        };
      } catch (err) {
        console.warn("WebSocket init deferred:", err);
      }
    }

    async function handleLoginSubmit(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const identifierInput = document.getElementById("login-identifier");
      const passwordInput = document.getElementById("login-password");
      const btn = document.getElementById("login-btn");

      const identifier = identifierInput.value.trim();
      const password = passwordInput.value;

      if (!identifier || !password) {
        handleLoginError("Username or password is wrong");
        return;
      }

      if (btn) btn.disabled = true;

      // Try HTTP login endpoint if configured
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ identifier, password })
        });

        if (response.ok) {
          const data = await response.json();
          if (data.user) {
            sessionStorage.setItem("chat_user", JSON.stringify(data.user));
          }
          showFeedback("Login successful! Redirecting...", false);
          setTimeout(() => {
            window.location.href = "chat.html";
          }, 600);
          return;
        } else if (response.status === 400 || response.status === 401 || response.status === 403) {
          handleLoginError("Username or password is wrong");
          return;
        }
      } catch (httpErr) {
        // Fall back to WebSocket
      }

      // WebSocket fallback
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          action: "login",
          identifier: identifier,
          password: password
        }));
      } else {
        handleLoginError("Username or password is wrong");
        initSocket();
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initSocket();

      const form = document.getElementById("login-form");
      if (form) {
        form.addEventListener("submit", handleLoginSubmit);
      }

      const idInput = document.getElementById("login-identifier");
      if (idInput) {
        idInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            document.getElementById("login-password").focus();
          }
        });
      }
    });
  </script>
</body>
</html>
