<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Real-Time Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">✨</div>
      <h2>Create Account</h2>
      <p>Fill in your details to start chatting</p>
    </div>

    <div class="auth-fields">
      <div class="field-group">
        <label for="reg-fullname">Full Name</label>
        <input 
          type="text" 
          id="reg-fullname" 
          class="input-field" 
          placeholder="John Doe" 
          autofocus 
        />
      </div>

      <div class="field-group">
        <label for="reg-username">Username</label>
        <input 
          type="text" 
          id="reg-username" 
          class="input-field" 
          placeholder="johndoe" 
        />
      </div>

      <div class="field-group">
        <label for="reg-email">Email Address</label>
        <input 
          type="email" 
          id="reg-email" 
          class="input-field" 
          placeholder="john@example.com" 
        />
      </div>

      <div class="field-group">
        <label for="reg-password">Password</label>
        <input 
          type="password" 
          id="reg-password" 
          class="input-field" 
          placeholder="••••••••" 
        />
      </div>

      <div class="field-group">
        <label for="reg-confirm-password">Confirm Password</label>
        <input 
          type="password" 
          id="reg-confirm-password" 
          class="input-field" 
          placeholder="••••••••" 
        />
      </div>

      <button id="reg-btn" class="btn btn-primary" onclick="submitRegister()">Sign Up</button>
    </div>

    <div id="feedback" class="auth-feedback hidden"></div>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <script src="vendor/ably.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/socket-shim.js"></script>
  <script>
    let socket = null;

    function showFeedback(msg, isError = true) {
      const fb = document.getElementById("feedback");
      fb.textContent = msg;
      fb.className = `auth-feedback ${isError ? 'error' : 'success'}`;
      fb.classList.remove("hidden");
    }

    function initSocket() {
      socket = createChatSocket();

      socket.onopen = () => {
        const fb = document.getElementById("feedback");
        if (fb.classList.contains("error")) {
          fb.classList.add("hidden");
        }
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.action === "auth_error") {
          showFeedback(data.text, true);
        } else if (data.action === "register_success") {
          showFeedback(data.text + " Redirecting to login...", false);
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        }
      };

      socket.onerror = () => {
        showFeedback("Could not connect to the chat server.", true);
      };

      socket.onclose = () => {
        showFeedback("Cannot connect to the server. Please refresh and retry.", true);
      };
    }

    function submitRegister() {
      const full_name = document.getElementById("reg-fullname").value.trim();
      const username = document.getElementById("reg-username").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;
      const confirm_password = document.getElementById("reg-confirm-password").value;

      if (!full_name || !username || !email || !password || !confirm_password) {
        showFeedback("All fields are required.", true);
        return;
      }

      if (password !== confirm_password) {
        showFeedback("Passwords do not match. Please verify and re-enter.", true);
        document.getElementById("reg-confirm-password").focus();
        return;
      }

      if (password.length < 6) {
        showFeedback("Password must be at least 6 characters long.", true);
        document.getElementById("reg-password").focus();
        return;
      }

      if (!socket || socket.readyState !== WebSocket.OPEN) {
        showFeedback("Connecting to server, please try again in a second...", true);
        initSocket();
        return;
      }

      socket.send(JSON.stringify({
        action: "register",
        full_name: full_name,
        username: username,
        email: email,
        password: password
      }));
    }

    document.getElementById("reg-password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitRegister();
    });

    document.getElementById("reg-confirm-password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitRegister();
    });

    window.addEventListener("DOMContentLoaded", initSocket);
  </script>
</body>
</html>
