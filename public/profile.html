<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile - Real-Time Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <!-- Clickable Avatar Preview -->
      <div style="position: relative; display: inline-block; cursor: pointer; margin-bottom: 12px;" onclick="document.getElementById('avatar-file-input').click()" title="Click to change photo">
        <div id="avatar-preview-box" class="user-avatar" style="width: 72px; height: 72px; font-size: 26px; margin: 0 auto; overflow: hidden; border: 2px solid var(--accent);">?</div>
        <div style="position: absolute; bottom: 0; right: 0; background: var(--accent); color: #fff; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-card-solid);">📷</div>
      </div>
      <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" onchange="handleAvatarSelected(event)" />

      <h2>Edit Profile</h2>
      <p>Update your photo and account details</p>
    </div>

    <div class="auth-fields">
      <div class="field-group">
        <label>Full Name</label>
        <input type="text" id="prof-fullname" class="input-field" placeholder="Full Name" />
      </div>

      <div class="field-group">
        <label>Username</label>
        <input type="text" id="prof-username" class="input-field" placeholder="Username" />
      </div>

      <div class="field-group">
        <label>Email Address</label>
        <input type="email" id="prof-email" class="input-field" placeholder="Email Address" />
      </div>

      <div class="field-group">
        <label>New Password (leave blank to keep current)</label>
        <input type="password" id="prof-new-password" class="input-field" placeholder="••••••••" />
      </div>

      <div class="field-group">
        <label style="color: #f87171;">Current Password (required to save changes)</label>
        <input type="password" id="prof-current-password" class="input-field" placeholder="••••••••" />
      </div>

      <button class="btn btn-primary" onclick="submitProfileUpdate()">Save Changes</button>
      <button class="btn btn-secondary" onclick="window.location.href='chat.html'">Back to Chat</button>
    </div>

    <div id="feedback" class="auth-feedback hidden"></div>
  </div>

  <script>
    const sessionData = sessionStorage.getItem("chat_user");
    if (!sessionData) {
      window.location.href = "login.html";
    }
    const user = JSON.parse(sessionData || "{}");

    let currentAvatarBase64 = user.avatar || "";

    // Pre-populate input values and current avatar
    document.getElementById("prof-fullname").value = user.full_name || "";
    document.getElementById("prof-username").value = user.username || "";
    document.getElementById("prof-email").value = user.email || "";

    function renderAvatarPreview() {
      const box = document.getElementById("avatar-preview-box");
      if (currentAvatarBase64) {
        box.innerHTML = `<img src="${currentAvatarBase64}" style="width: 100%; height: 100%; object-fit: cover;" />`;
      } else {
        box.textContent = (user.full_name || user.username || "?").charAt(0).toUpperCase();
      }
    }
    renderAvatarPreview();

    function handleAvatarSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        showFeedback("Profile picture must be under 5MB.", true);
        event.target.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        currentAvatarBase64 = reader.result;
        renderAvatarPreview();
      };
      reader.readAsDataURL(file);
    }

    let socket = null;

    function showFeedback(msg, isError) {
      const fb = document.getElementById("feedback");
      fb.textContent = msg;
      fb.className = `auth-feedback ${isError ? 'error' : 'success'}`;
      fb.classList.remove("hidden");
    }

    function initSocket() {
      socket = new WebSocket("ws://127.0.0.1:8765");

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.action === "profile_error") {
          showFeedback(data.text, true);
        } else if (data.action === "profile_success") {
          sessionStorage.setItem("chat_user", JSON.stringify(data.user));
          showFeedback("Profile updated! Returning to chat...", false);
          setTimeout(() => {
            window.location.href = "chat.html";
          }, 1000);
        }
      };

      socket.onclose = () => {
        showFeedback("Cannot connect to server. Ensure server.py is running.", true);
      };
    }

    function submitProfileUpdate() {
      const new_fullname = document.getElementById("prof-fullname").value.trim();
      const new_username = document.getElementById("prof-username").value.trim();
      const new_email = document.getElementById("prof-email").value.trim();
      const new_password = document.getElementById("prof-new-password").value;
      const current_password = document.getElementById("prof-current-password").value;

      if (!new_fullname || !new_username || !new_email) {
        showFeedback("Full Name, Username, and Email cannot be empty.", true);
        return;
      }

      if (!current_password) {
        showFeedback("Please enter your current password to confirm changes.", true);
        return;
      }

      if (!socket || socket.readyState !== WebSocket.OPEN) {
        showFeedback("Connecting to server, please wait...", true);
        initSocket();
        return;
      }

      socket.send(JSON.stringify({
        action: "update_profile",
        current_username: user.username,
        current_password: current_password,
        new_fullname: new_fullname,
        new_username: new_username,
        new_email: new_email,
        new_password: new_password,
        avatar: currentAvatarBase64
      }));
    }

    window.addEventListener("DOMContentLoaded", initSocket);
  </script>
</body>
</html>
