<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="chat-view">
    <!-- PANEL 1: LEFT DIRECTORY & SEARCH -->
    <div id="sidebar">
      <!-- Signed In User Bar -->
      <div class="user-profile-header">
        <div class="avatar-wrapper" style="cursor: pointer;" onclick="window.location.href='profile.html'" title="Edit Profile">
          <div class="user-avatar" id="current-user-avatar">?</div>
          <span class="status-dot-pip online"></span>
        </div>
        <div class="user-meta" style="cursor: pointer;" onclick="window.location.href='profile.html'" title="Edit Profile">
          <span class="name" id="current-user-fullname"></span>
          <span class="tag">Online • Edit</span>
        </div>
        <button id="notify-toggle" class="btn btn-secondary btn-icon" title="Enable notifications" onclick="toggleNotifications()">🔕</button>
        <button class="btn btn-secondary btn-icon" title="Edit Profile" onclick="window.location.href='profile.html'">✏️</button>
        <button class="btn btn-secondary btn-icon" title="Log Out" onclick="logout()">✕</button>
      </div>

      <!-- Find a Friend Filter Bar -->
      <div class="search-box">
        <input type="text" id="friend-filter" class="input-field" placeholder="Find a friend..." oninput="filterConversations()" />
      </div>

      <!-- Groups Section -->
      <div class="section-title">
        <span>Groups</span>
        <button class="btn btn-secondary btn-sm" onclick="openGroupModal()">+ New</button>
      </div>
      <div id="groups-list" class="sidebar-scrollable" style="max-height: 140px;"></div>

      <!-- Direct Chats Section -->
      <div class="section-title">Chats</div>
      <div id="friends-list" class="sidebar-scrollable" style="flex-grow: 1;"></div>
    </div>

    <!-- PANEL 2: CENTER CHAT -->
    <div id="main-chat">
      <div class="chat-topbar">
        <div class="topbar-left">
          <div class="avatar-wrapper" id="active-chat-avatar-wrapper" style="display: none;">
            <div class="user-avatar" id="active-chat-avatar">?</div>
            <span class="status-dot-pip" id="active-chat-status-pip"></span>
          </div>
          <div>
            <div class="chat-title" id="chat-header">Select a conversation</div>
            <div class="chat-subtitle" id="chat-subtitle">Choose a friend or group from the left</div>
          </div>
        </div>

        <!-- Direct Chat Actions (Unfriend / Block) -->
        <div id="direct-chat-actions" class="hidden" style="display: flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm" onclick="unfriendActiveChat()">Unfriend</button>
          <button class="btn btn-secondary btn-sm" style="color: #ef4444;" onclick="blockActiveChat()">Block</button>
        </div>

        <!-- Group Chat Actions (Leave Group) -->
        <div id="group-chat-actions" class="hidden" style="display: flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm" style="color: #ef4444;" onclick="leaveActiveGroup()">Leave Group</button>
        </div>
      </div>

      <!-- Notification permission banner -->
      <div id="notif-banner" class="notif-banner hidden">
        <span>🔔 Get notified about new messages, requests, and group invites?</span>
        <div class="notif-banner-actions">
          <button class="btn btn-secondary btn-sm" onclick="dismissNotificationBanner()">Not now</button>
          <button class="btn btn-primary btn-sm" onclick="enableNotificationsFromBanner()">Enable</button>
        </div>
      </div>

      <!-- Message History Stream -->
      <div id="chat-box"></div>

      <!-- Rounded Input Capsule with Media Attachment & Voice Recorder -->
      <div class="chat-input-bar">
        <input 
          type="file" 
          id="media-file-input" 
          accept="image/*,audio/*,video/*" 
          style="display: none;" 
          onchange="handleFileSelected(event)" 
        />
        <button 
          type="button" 
          class="btn btn-secondary btn-icon" 
          title="Attach Media" 
          onclick="document.getElementById('media-file-input').click()"
        >
          📎
        </button>
        <button 
          type="button" 
          id="record-btn" 
          class="btn btn-secondary btn-icon" 
          title="Record Voice Note" 
          onclick="toggleVoiceRecording()"
        >
          🎙️
        </button>
        <input type="text" id="message-input" class="input-field" placeholder="Type your message..." style="flex-grow: 1;" disabled />
        <button id="send-btn" class="btn btn-primary" onclick="sendMessage()" disabled>Send</button>
      </div>
    </div>

    <!-- PANEL 3: RIGHT SOCIAL & GROUP INFO -->
    <div id="social-panel">
      <!-- VIEW A: Group Members (Active when inside a group) -->
      <div id="group-info-view" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <div class="section-title">
          <span>Group Members</span>
          <button id="add-member-btn" class="btn btn-secondary btn-sm hidden" onclick="toggleInlineAddMemberCard()">+ Add</button>
        </div>
        <div id="group-member-count" style="font-size: 11px; text-transform: none; color: var(--accent); margin-top: 2px;"></div>

        <!-- Inline Add Member Dropdown -->
        <div id="inline-add-member-card" class="hidden" style="background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Invite Contact</div>
          <div id="inline-eligible-friends" class="sidebar-scrollable" style="max-height: 95px; gap: 4px;"></div>
          
          <div style="display: flex; gap: 6px; margin-top: 4px;">
            <input type="text" id="inline-add-username-input" class="input-field" placeholder="Or enter username..." style="padding: 6px 10px; font-size: 12px;" />
            <button class="btn btn-primary btn-sm" onclick="submitInlineAddMember()">Add</button>
          </div>
        </div>

        <div id="group-members-list" class="sidebar-scrollable" style="flex-grow: 1; margin-top: 10px;"></div>
      </div>

      <!-- VIEW B: Friend Management & Blocked List -->
      <div id="social-default-view">
        <div class="section-title">Add Friend</div>
        <div class="social-input-group">
          <input type="text" id="target-username" class="input-field" placeholder="Enter username..." />
          <button class="btn btn-primary" onclick="sendFriendRequest()">Send Request</button>
        </div>

        <div class="section-title" style="margin-top: 16px;">
          <span>Friend Requests</span>
          <span id="request-count-badge" class="unread-badge hidden"></span>
        </div>
        <div id="requests-list" class="sidebar-scrollable" style="max-height: 140px;"></div>

        <div class="section-title" style="margin-top: 16px;">Blocked Users</div>
        <div id="blocked-list" class="sidebar-scrollable" style="max-height: 140px;"></div>
      </div>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div id="modal" class="hidden">
    <div id="modal-content">
      <h3 style="margin-bottom: 6px;">Create New Group</h3>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 14px;">Assemble a room with your friends</p>
      <input type="text" id="group-name-input" class="input-field" placeholder="Group Name (e.g., Core Team)" style="width: 100%; margin-bottom: 14px;" />
      <div style="font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Select Members:</div>
      <div id="group-friends-checklist" class="modal-checklist"></div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-secondary" onclick="closeGroupModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createGroup()">Create</button>
      </div>
    </div>
  </div>

  <!-- In-app toast fallback -->
  <div id="toast-container"></div>

  <script src="notifications.js"></script>
  <script>
    const sessionData = sessionStorage.getItem("chat_user");
    if (!sessionData) {
      window.location.href = "login.html";
    }
    const user = JSON.parse(sessionData || "{}");

    let socket = null;
    let currentUser = user.username;
    let activeChat = null;
    let currentFriends = [];
    let currentRequests = [];
    let currentGroups = [];
    let currentBlocked = [];
    let cachedGroupMembers = [];

    // Notification state
    const BASE_TITLE = document.title;
    const BANNER_DISMISSED_KEY = "chat_notify_banner_dismissed";
    let unreadCounts = {};
    let notificationsEnabled = false;

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function renderAvatarHTML(avatarUrl, nameFallback) {
      if (avatarUrl) {
        return `<img src="${avatarUrl}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" />`;
      }
      return (nameFallback || "?").charAt(0).toUpperCase();
    }

    // Header Init
    document.getElementById("current-user-fullname").textContent = user.full_name || currentUser;
    document.getElementById("current-user-avatar").innerHTML = renderAvatarHTML(user.avatar, user.full_name || currentUser);

    // ---------------- NOTIFICATIONS ----------------

    function notificationsAvailable() {
      return typeof window.ChatNotify !== "undefined" && ChatNotify.supported();
    }

    function initNotifications() {
      notificationsEnabled = notificationsAvailable() && ChatNotify.canNotify();
      updateNotificationButton();

      const banner = document.getElementById("notif-banner");
      if (!banner) return;

      let dismissed = false;
      try {
        dismissed = localStorage.getItem(BANNER_DISMISSED_KEY) === "true";
      } catch (err) {
        /* storage unavailable */
      }

      if (notificationsAvailable() && ChatNotify.permission() === "default" && !dismissed) {
        banner.classList.remove("hidden");
      } else {
        banner.classList.add("hidden");
      }
    }

    function updateNotificationButton() {
      const btn = document.getElementById("notify-toggle");
      if (!btn) return;

      const granted = notificationsAvailable() && ChatNotify.permission() === "granted";
      const active = granted && notificationsEnabled;
      btn.textContent = active ? "🔔" : "🔕";
      btn.classList.toggle("active", active);

      if (!notificationsAvailable()) {
        btn.title = "Browser notifications need localhost or HTTPS";
      } else if (granted) {
        btn.title = active ? "Notifications on — click to mute" : "Notifications muted — click to enable";
      } else if (ChatNotify.permission() === "denied") {
        btn.title = "Notifications blocked in browser settings";
      } else {
        btn.title = "Enable browser notifications";
      }
    }

    async function toggleNotifications() {
      if (!notificationsAvailable()) {
        showToast("Browser notifications need localhost or HTTPS.", "error");
        return;
      }

      const current = ChatNotify.permission();

      if (current === "granted") {
        notificationsEnabled = !notificationsEnabled;
        ChatNotify.setMuted(!notificationsEnabled);
        updateNotificationButton();
        showToast(notificationsEnabled ? "Notifications enabled." : "Notifications muted.", "info");
        return;
      }

      if (current === "denied") {
        showToast("Notifications are blocked. Re-enable them in your browser's site settings.", "error");
        updateNotificationButton();
        return;
      }

      const result = await ChatNotify.requestPermission();
      notificationsEnabled = ChatNotify.canNotify();
      updateNotificationButton();
      hideNotificationBanner();

      if (result === "granted") {
        showToast("Notifications enabled.", "success");
      } else if (result === "denied") {
        showToast("Notifications blocked. Re-enable them in your browser's site settings.", "error");
      }
    }

    function enableNotificationsFromBanner() {
      toggleNotifications();
    }

    function dismissNotificationBanner() {
      try {
        localStorage.setItem(BANNER_DISMISSED_KEY, "true");
      } catch (err) {
        /* storage unavailable */
      }
      hideNotificationBanner();
    }

    function hideNotificationBanner() {
      const banner = document.getElementById("notif-banner");
      if (banner) banner.classList.add("hidden");
    }

    function showToast(message, kind = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;

      const toast = document.createElement("div");
      toast.className = `toast ${kind}`;
      toast.textContent = message;
      container.appendChild(toast);

      const remove = () => {
        if (!toast.isConnected) return;
        toast.classList.add("leaving");
        setTimeout(() => toast.remove(), 200);
      };

      toast.onclick = remove;
      setTimeout(remove, 4000);
    }

    function deliverNotification(options, fallbackText) {
      if (typeof window.ChatNotify === "undefined") {
        showToast(fallbackText, "message");
        return;
      }
      if (ChatNotify.muted()) return;
      if (ChatNotify.notify(options)) return;
      showToast(fallbackText, "message");
    }

    function conversationKey(chatType, id) {
      return chatType === "direct" ? `dm:${id}` : `group:${id}`;
    }

    function renderUnreadBadge(key) {
      const count = unreadCounts[key] || 0;
      if (!count) return "";
      return `<span class="unread-badge">${count > 99 ? "99+" : count}</span>`;
    }

    function totalUnread() {
      return Object.values(unreadCounts).reduce((sum, n) => sum + n, 0);
    }

    function updateTitle() {
      const total = totalUnread();
      document.title = total > 0 ? `(${total}) ${BASE_TITLE}` : BASE_TITLE;
    }

    function bumpUnread(key) {
      unreadCounts[key] = (unreadCounts[key] || 0) + 1;
      renderDashboard();
      updateTitle();
    }

    function focusConversation(type, id, name, isOnline, avatar) {
      try {
        window.focus();
      } catch (err) {
        /* focus may be blocked */
      }

      if (type === "group") {
        const group = currentGroups.find(g => String(g.id) === String(id));
        selectChat("group", group ? group.id : id, group ? group.name : (name || "Group chat"), true, "");
      } else {
        const friend = currentFriends.find(f => f.username === id);
        selectChat(
          "direct",
          id,
          name || (friend && friend.full_name) || id,
          friend ? friend.online : !!isOnline,
          avatar || (friend && friend.avatar) || ""
        );
      }
    }

    function focusRequestsPanel() {
      try {
        window.focus();
      } catch (err) {
        /* focus may be blocked */
      }
      showDefaultSocialView();
      const list = document.getElementById("requests-list");
      if (!list) return;
      list.scrollIntoView({ behavior: "smooth", block: "center" });
      list.classList.add("flash");
      setTimeout(() => list.classList.remove("flash"), 1400);
    }

    function handleServerNotification(data) {
      const meta = data.meta || {};
      const keyPart = meta.from_user || meta.username || meta.group_id || "";

      deliverNotification(
        {
          title: data.title || "Chat",
          body: data.body || "",
          tag: `server:${data.kind || "event"}:${keyPart}`,
          onclick: () => {
            if (data.kind === "friend_request") {
              focusRequestsPanel();
            } else if (data.kind === "group_invite" && meta.group_id != null) {
              focusConversation("group", meta.group_id, meta.group_name, true, "");
            } else {
              try {
                window.focus();
              } catch (err) {
                /* focus may be blocked */
              }
            }
          }
        },
        `${data.title || "Chat"}: ${data.body || ""}`
      );
    }

    function initWebSocket() {
      socket = new WebSocket("ws://127.0.0.1:8765");

      socket.onopen = () => {
        socket.send(JSON.stringify({ action: "resume_session", username: currentUser }));
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.action === "dashboard_sync") {
          currentFriends = data.friends;
          currentRequests = data.requests;
          currentGroups = data.groups;
          currentBlocked = data.blocked || [];
          renderDashboard();
          if (activeChat && activeChat.type === "group") {
            const stillMember = currentGroups.some(g => String(g.id) === String(activeChat.id));
            if (!stillMember) {
              resetActiveChat();
            } else {
              showGroupView(cachedGroupMembers);
            }
          }
        } else if (data.action === "alert") {
          alert(data.text);
        } else if (data.action === "chat_history") {
          renderChatHistory(data.history);
          if (data.chat_type === "group") {
            cachedGroupMembers = data.members || [];
            showGroupView(cachedGroupMembers);
            document.getElementById("direct-chat-actions").classList.add("hidden");
            document.getElementById("group-chat-actions").classList.remove("hidden");
          } else {
            showDefaultSocialView();
            document.getElementById("direct-chat-actions").classList.remove("hidden");
            document.getElementById("group-chat-actions").classList.add("hidden");
          }
        } else if (data.action === "group_members_updated") {
          if (activeChat && activeChat.type === "group" && String(activeChat.id) === String(data.group_id)) {
            cachedGroupMembers = data.members || [];
            showGroupView(cachedGroupMembers);
          }
        } else if (data.action === "new_message") {
          handleIncomingMessage(data);
        } else if (data.action === "notification") {
          handleServerNotification(data);
        }
      };
    }

    window.addEventListener("DOMContentLoaded", () => {
      initWebSocket();
      initNotifications();
    });

    function logout() {
      sessionStorage.removeItem("chat_user");
      window.location.href = "login.html";
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function showGroupView(members) {
      cachedGroupMembers = members;
      document.getElementById("social-default-view").classList.add("hidden");
      const groupView = document.getElementById("group-info-view");
      groupView.classList.remove("hidden");

      const list = document.getElementById("group-members-list");
      list.innerHTML = "";

      const onlineCount = members.filter(m => m.online).length;
      document.getElementById("group-member-count").textContent = `${members.length} members (${onlineCount} online)`;
      document.getElementById("chat-subtitle").textContent = `${members.length} members • ${onlineCount} online`;

      const friendUsernames = new Set(currentFriends.map(f => f.username));

      const meRecord = members.find(m => m.username === currentUser);
      const amIAdmin = meRecord && meRecord.role === "admin";

      const addMemberBtn = document.getElementById("add-member-btn");
      if (addMemberBtn) {
        addMemberBtn.classList.toggle("hidden", !amIAdmin);
        if (!amIAdmin) {
          document.getElementById("inline-add-member-card").classList.add("hidden");
        }
      }

      renderInlineEligibleFriends();

      members.forEach(member => {
        const isMe = member.username === currentUser;
        const isFriend = friendUsernames.has(member.username);
        const displayName = member.full_name || member.username;
        const isAdmin = member.role === "admin";

        let actions = [];

        if (isAdmin) {
          actions.push(`<span style="font-size: 10px; font-weight: 700; background: rgba(99, 102, 241, 0.2); color: var(--accent); padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(99,102,241,0.4);">Admin</span>`);
        }

        if (isMe) {
          actions.push(`<span style="font-size: 11px; color: var(--text-muted);">(you)</span>`);
        } else if (isFriend) {
          actions.push(`<span style="font-size: 11px; color: var(--online);">Friend</span>`);
        } else {
          actions.push(`<button class="btn btn-sm btn-primary" style="padding: 3px 6px; font-size: 10px;" onclick="sendFriendRequest('${member.username}')">+ Add</button>`);
        }

        // Admin actions for non-admin members
        if (amIAdmin && !isAdmin && !isMe) {
          actions.push(`<button class="btn btn-sm btn-secondary" style="padding: 3px 6px; font-size: 10px;" onclick="promoteToAdmin('${member.username}')">Make Admin</button>`);
          actions.push(`<button class="btn btn-sm btn-secondary" style="padding: 3px 6px; font-size: 10px; color: #ef4444;" onclick="removeMemberFromGroup('${member.username}')">Remove</button>`);
        }

        const div = document.createElement("div");
        div.className = "member-row";
        div.style.justifyContent = "space-between";
        div.innerHTML = `
          <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
            <div class="avatar-wrapper" style="width: 34px; height: 34px; flex-shrink: 0;">
              <div class="user-avatar" style="font-size: 12px; overflow: hidden;">${renderAvatarHTML(member.avatar, displayName)}</div>
              <span class="status-dot-pip ${member.online ? 'online' : 'offline'}"></span>
            </div>
            <div class="item-info">
              <span class="item-title" style="font-size: 13px;">${escapeHtml(displayName)}</span>
              <span class="item-subtitle">@${escapeHtml(member.username)}</span>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">${actions.join("")}</div>
        `;
        list.appendChild(div);
      });
    }

    function removeMemberFromGroup(targetUsername) {
      if (!activeChat || activeChat.type !== "group") return;
      if (confirm(`Are you sure you want to remove @${targetUsername} from the group?`)) {
        socket.send(JSON.stringify({
          action: "remove_group_member",
          group_id: activeChat.id,
          target_username: targetUsername
        }));
      }
    }

    function toggleInlineAddMemberCard() {
      const card = document.getElementById("inline-add-member-card");
      const isClosed = card.classList.contains("hidden");
      if (isClosed) {
        renderInlineEligibleFriends();
        card.classList.remove("hidden");
        document.getElementById("inline-add-username-input").focus();
      } else {
        card.classList.add("hidden");
      }
    }

    function renderInlineEligibleFriends() {
      const container = document.getElementById("inline-eligible-friends");
      if (!container) return;
      container.innerHTML = "";

      const currentMemberUsernames = new Set(cachedGroupMembers.map(m => m.username));
      const eligibleFriends = currentFriends.filter(f => !currentMemberUsernames.has(f.username));

      if (eligibleFriends.length === 0) {
        container.innerHTML = "<span style='color:var(--text-muted); font-size:11px;'>No eligible contacts</span>";
        return;
      }

      eligibleFriends.forEach(f => {
        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.alignItems = "center";
        row.style.justifyContent = "space-between";
        row.style.padding = "3px 0";
        row.innerHTML = `
          <span style="font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px;">${escapeHtml(f.full_name || f.username)}</span>
          <button class="btn btn-sm btn-primary" style="padding: 2px 6px; font-size: 10px;" onclick="addSpecificMember('${f.username}')">+ Add</button>
        `;
        container.appendChild(row);
      });
    }

    function addSpecificMember(username) {
      if (!activeChat || activeChat.type !== "group" || !username) return;
      socket.send(JSON.stringify({
        action: "add_group_member",
        group_id: activeChat.id,
        target_username: username
      }));
    }

    function submitInlineAddMember() {
      const input = document.getElementById("inline-add-username-input");
      const username = input.value.trim();
      if (!username) {
        alert("Please enter a username to add.");
        return;
      }
      addSpecificMember(username);
      input.value = "";
    }

    function promoteToAdmin(targetUsername) {
      if (!activeChat || activeChat.type !== "group") return;
      if (confirm(`Promote @${targetUsername} to admin of this group?`)) {
        socket.send(JSON.stringify({
          action: "promote_admin",
          group_id: activeChat.id,
          target_username: targetUsername
        }));
      }
    }

    function leaveActiveGroup() {
      if (!activeChat || activeChat.type !== "group") return;
      if (confirm(`Are you sure you want to leave "${activeChat.name}"?`)) {
        socket.send(JSON.stringify({
          action: "leave_group",
          group_id: activeChat.id
        }));
        resetActiveChat();
      }
    }

    function showDefaultSocialView() {
      document.getElementById("group-info-view").classList.add("hidden");
      document.getElementById("social-default-view").classList.remove("hidden");
      document.getElementById("inline-add-member-card").classList.add("hidden");
    }

    function renderDashboard() {
      const reqBadge = document.getElementById("request-count-badge");
      if (reqBadge) {
        reqBadge.textContent = currentRequests.length;
        reqBadge.classList.toggle("hidden", currentRequests.length === 0);
      }

      // Pending Requests
      const reqList = document.getElementById("requests-list");
      reqList.innerHTML = currentRequests.length ? "" : "<span style='color:var(--text-muted); font-size:12px;'>No pending requests</span>";
      currentRequests.forEach(sender => {
        const div = document.createElement("div");
        div.className = "req-card";
        div.innerHTML = `
          <span>${escapeHtml(sender)}</span>
          <button class="btn btn-sm btn-primary" onclick="acceptRequest('${sender}')">Accept</button>
        `;
        reqList.appendChild(div);
      });

      // Blocked List
      const bList = document.getElementById("blocked-list");
      bList.innerHTML = currentBlocked.length ? "" : "<span style='color:var(--text-muted); font-size:12px;'>No blocked users</span>";
      currentBlocked.forEach(blockedUser => {
        const div = document.createElement("div");
        div.className = "req-card";
        div.innerHTML = `
          <span>${escapeHtml(blockedUser)}</span>
          <button class="btn btn-sm btn-secondary" onclick="unblockUser('${blockedUser}')">Unblock</button>
        `;
        bList.appendChild(div);
      });

      const query = (document.getElementById("friend-filter")?.value || "").toLowerCase().trim();

      // Groups
      const gList = document.getElementById("groups-list");
      gList.innerHTML = "";
      const filteredGroups = currentGroups.filter(g => g.name.toLowerCase().includes(query));
      if (!filteredGroups.length) {
        gList.innerHTML = "<span style='color:var(--text-muted); font-size:12px;'>No groups found</span>";
      } else {
        filteredGroups.forEach(g => {
          const div = document.createElement("div");
          const isActive = activeChat && activeChat.type === "group" && activeChat.id === g.id;
          div.className = `list-item ${isActive ? 'active' : ''}`;
          div.innerHTML = `
            <div class="avatar-wrapper">
              <div class="user-avatar" style="background: #475569;">#</div>
            </div>
            <div class="item-info">
              <span class="item-title">${escapeHtml(g.name)}</span>
              <span class="item-subtitle">Group Channel</span>
            </div>
            ${renderUnreadBadge(`group:${g.id}`)}
          `;
          div.onclick = () => selectChat("group", g.id, g.name, true, "");
          gList.appendChild(div);
        });
      }

      // Friends
      const fList = document.getElementById("friends-list");
      fList.innerHTML = "";
      const filteredFriends = currentFriends.filter(f => 
        (f.full_name || f.username).toLowerCase().includes(query) || 
        f.username.toLowerCase().includes(query)
      );

      if (!filteredFriends.length) {
        fList.innerHTML = "<span style='color:var(--text-muted); font-size:12px;'>No contacts found</span>";
      } else {
        filteredFriends.forEach(f => {
          const div = document.createElement("div");
          const isActive = activeChat && activeChat.type === "direct" && activeChat.id === f.username;
          div.className = `list-item ${isActive ? 'active' : ''}`;
          div.onclick = () => selectChat("direct", f.username, f.full_name || f.username, f.online, f.avatar);
          div.innerHTML = `
            <div class="avatar-wrapper">
              <div class="user-avatar" style="overflow: hidden;">${renderAvatarHTML(f.avatar, f.full_name || f.username)}</div>
              <span class="status-dot-pip ${f.online ? 'online' : 'offline'}"></span>
            </div>
            <div class="item-info">
              <span class="item-title">${escapeHtml(f.full_name || f.username)}</span>
              <span class="item-subtitle">${f.online ? 'Online' : 'Offline'}</span>
            </div>
            ${renderUnreadBadge(`dm:${f.username}`)}
          `;
          fList.appendChild(div);
        });
      }
    }

    function filterConversations() {
      renderDashboard();
    }

    function selectChat(type, id, name, isOnline, avatar = "") {
      activeChat = { type, id, name, avatar };

      const unreadKey = conversationKey(type, id);
      if (unreadCounts[unreadKey]) {
        delete unreadCounts[unreadKey];
        updateTitle();
      }

      const avatarWrap = document.getElementById("active-chat-avatar-wrapper");
      const avatarEl = document.getElementById("active-chat-avatar");
      const statusPip = document.getElementById("active-chat-status-pip");

      avatarWrap.style.display = "block";
      if (type === "group") {
        avatarEl.innerHTML = "#";
        statusPip.className = "status-dot-pip online";
        document.getElementById("chat-subtitle").textContent = "Loading members...";
        document.getElementById("direct-chat-actions").classList.add("hidden");
        document.getElementById("group-chat-actions").classList.remove("hidden");
      } else {
        avatarEl.innerHTML = renderAvatarHTML(avatar, name);
        statusPip.className = `status-dot-pip ${isOnline ? 'online' : 'offline'}`;
        document.getElementById("chat-subtitle").textContent = isOnline ? "Active now" : "Offline";
        document.getElementById("direct-chat-actions").classList.remove("hidden");
        document.getElementById("group-chat-actions").classList.add("hidden");
      }

      document.getElementById("chat-header").textContent = name;
      document.getElementById("message-input").disabled = false;
      document.getElementById("send-btn").disabled = false;

      renderDashboard();

      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          action: "load_chat",
          chat_type: type,
          target_id: id
        }));
      }
    }

    function unfriendActiveChat() {
      if (!activeChat || activeChat.type !== "direct") return;
      if (confirm(`Unfriend @${activeChat.id}?`)) {
        socket.send(JSON.stringify({ action: "unfriend", target_username: activeChat.id }));
        resetActiveChat();
      }
    }

    function blockActiveChat() {
      if (!activeChat || activeChat.type !== "direct") return;
      if (confirm(`Block @${activeChat.id}? They will not be able to message you.`)) {
        socket.send(JSON.stringify({ action: "block", target_username: activeChat.id }));
        resetActiveChat();
      }
    }

    function unblockUser(username) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ action: "unblock", target_username: username }));
      }
    }

    function resetActiveChat() {
      activeChat = null;
      document.getElementById("active-chat-avatar-wrapper").style.display = "none";
      document.getElementById("chat-header").textContent = "Select a conversation";
      document.getElementById("chat-subtitle").textContent = "Choose a friend or group from the left";
      document.getElementById("direct-chat-actions").classList.add("hidden");
      document.getElementById("group-chat-actions").classList.add("hidden");
      document.getElementById("message-input").disabled = true;
      document.getElementById("send-btn").disabled = true;
      document.getElementById("chat-box").innerHTML = "";
      showDefaultSocialView();
    }

    function renderChatHistory(messages) {
      const box = document.getElementById("chat-box");
      box.innerHTML = "";
      messages.forEach(m => appendMessage(m.sender, m.text, m.msg_type || "text", m.avatar || ""));
    }

    function handleIncomingMessage(msg) {
      const isMine = msg.sender === currentUser;
      const key = conversationKey(msg.chat_type, msg.target_id);
      const isActive = !!activeChat &&
        activeChat.type === msg.chat_type &&
        String(activeChat.id) === String(msg.target_id);
      const isFocused = document.visibilityState === "visible" && document.hasFocus();

      if (isActive) {
        appendMessage(msg.sender, msg.text, msg.msg_type || "text", msg.avatar || "");
      }

      if (isMine) return;

      if (!isActive) {
        bumpUnread(key);
      }

      if (isActive && isFocused) return;

      const previewText = (typeof window.ChatNotify !== "undefined")
        ? ChatNotify.preview(msg.msg_type, msg.text)
        : "New message";

      if (msg.chat_type === "direct") {
        const friend = currentFriends.find(f => f.username === msg.sender);
        const displayName = msg.sender_name || (friend && friend.full_name) || msg.sender;
        const icon = msg.avatar || (friend && friend.avatar) || "";

        deliverNotification({
          title: displayName,
          body: previewText,
          icon: icon,
          tag: `dm:${msg.sender}`,
          onclick: () => focusConversation("direct", msg.sender, displayName, friend ? friend.online : false, icon)
        }, `${displayName}: ${previewText}`);
      } else {
        const group = currentGroups.find(g => String(g.id) === String(msg.target_id));
        const groupName = msg.group_name || (group && group.name) || "Group chat";
        const senderName = msg.sender_name || msg.sender;

        deliverNotification({
          title: groupName,
          body: `${senderName}: ${previewText}`,
          tag: `group:${msg.target_id}`,
          onclick: () => focusConversation("group", msg.target_id, groupName, true, "")
        }, `${groupName} — ${senderName}: ${previewText}`);
      }
    }

    function appendMessage(sender, content, msgType = "text", avatar = "") {
      const box = document.getElementById("chat-box");
      const isMe = sender === currentUser;

      const row = document.createElement("div");
      row.className = `msg-row ${isMe ? 'me' : 'them'}`;

      const avatarContent = renderAvatarHTML(avatar, sender);
      const avatarHtml = `<div class="msg-avatar" style="overflow: hidden;">${avatarContent}</div>`;
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let bubbleContent = "";
      if (msgType === "image") {
        bubbleContent = `<img src="${content}" class="chat-media-img" onclick="window.open('${content}', '_blank')" />`;
      } else if (msgType === "audio") {
        bubbleContent = `<audio controls src="${content}" class="chat-media-audio"></audio>`;
      } else if (msgType === "video") {
        bubbleContent = `<video controls src="${content}" class="chat-media-video"></video>`;
      } else {
        bubbleContent = `<span>${escapeHtml(content)}</span>`;
      }

      row.innerHTML = `
        ${avatarHtml}
        <div class="msg-content-block">
          <div class="msg-bubble">${bubbleContent}</div>
          <span class="msg-meta-time">${timeStr}</span>
        </div>
      `;

      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (text && activeChat && socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          action: "send_message",
          chat_type: activeChat.type,
          target_id: activeChat.id,
          text: text,
          msg_type: "text"
        }));
        input.value = "";
      }
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file || !activeChat) return;

      if (file.size > 10 * 1024 * 1024) {
        alert("File size exceeds 10MB limit.");
        event.target.value = "";
        return;
      }

      let msgType = "text";
      if (file.type.startsWith("image/")) msgType = "image";
      else if (file.type.startsWith("audio/")) msgType = "audio";
      else if (file.type.startsWith("video/")) msgType = "video";
      else {
        alert("Only images, audio, and videos are supported.");
        event.target.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const base64Data = reader.result;
        socket.send(JSON.stringify({
          action: "send_message",
          chat_type: activeChat.type,
          target_id: activeChat.id,
          text: base64Data,
          msg_type: msgType
        }));
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    async function toggleVoiceRecording() {
      if (!activeChat) {
        alert("Please select a conversation first.");
        return;
      }

      const recBtn = document.getElementById("record-btn");

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(track => track.stop());

            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const reader = new FileReader();
            reader.onloadend = () => {
              const base64Audio = reader.result;
              if (socket && socket.readyState === WebSocket.OPEN && activeChat) {
                socket.send(JSON.stringify({
                  action: "send_message",
                  chat_type: activeChat.type,
                  target_id: activeChat.id,
                  text: base64Audio,
                  msg_type: "audio"
                }));
              }
            };
            reader.readAsDataURL(audioBlob);
          };

          mediaRecorder.start();
          isRecording = true;
          recBtn.classList.add("recording");
          recBtn.title = "Click to stop and send";
        } catch (err) {
          alert("Microphone permission denied or not supported.");
          console.error("Mic error:", err);
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
        isRecording = false;
        recBtn.classList.remove("recording");
        recBtn.title = "Record Voice Note";
      }
    }

    function sendFriendRequest(targetUsername = null) {
      const target = targetUsername || document.getElementById("target-username").value.trim();
      if (target && socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ action: "send_friend_request", to_user: target }));
        if (!targetUsername) {
          document.getElementById("target-username").value = "";
        }
      }
    }

    function acceptRequest(fromUser) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ action: "accept_friend_request", from_user: fromUser }));
      }
    }

    function openGroupModal() {
      const checklist = document.getElementById("group-friends-checklist");
      checklist.innerHTML = currentFriends.length ? "" : "<span style='color:var(--text-muted); font-size:12px;'>Add friends first</span>";
      currentFriends.forEach(f => {
        const div = document.createElement("div");
        div.innerHTML = `<label><input type="checkbox" value="${f.username}" /> ${f.full_name || f.username}</label>`;
        checklist.appendChild(div);
      });
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeGroupModal() {
      document.getElementById("modal").classList.add("hidden");
      document.getElementById("group-name-input").value = "";
    }

    function createGroup() {
      const name = document.getElementById("group-name-input").value.trim();
      const checkboxes = document.querySelectorAll("#group-friends-checklist input[type='checkbox']:checked");
      const selected = Array.from(checkboxes).map(cb => cb.value);

      if (!name) {
        alert("Please enter a group name.");
        return;
      }

      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          action: "create_group",
          name: name,
          members: selected
        }));
      }
      closeGroupModal();
    }

    document.getElementById("message-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    document.getElementById("target-username").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendFriendRequest();
    });

    document.getElementById("inline-add-username-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitInlineAddMember();
    });
  </script>
</body>
