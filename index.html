<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Real-Time Chat & Groups</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px auto; max-width: 960px; }
    .hidden { display: none !important; }
    #app { display: flex; height: 600px; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
    #sidebar { width: 320px; border-right: 1px solid #ccc; padding: 12px; display: flex; flex-direction: column; background: #f8f9fa; }
    #main-chat { flex-grow: 1; display: flex; flex-direction: column; padding: 12px; background: #fff; }
    #chat-box { flex-grow: 1; border: 1px solid #ddd; border-radius: 4px; padding: 10px; overflow-y: auto; background: #fafafa; margin-bottom: 10px; }
    .list-item { padding: 8px; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; margin-bottom: 4px; }
    .list-item:hover { background: #e9ecef; }
    .list-item.active { background: #cfe2ff; font-weight: bold; }
    .status-online { color: green; font-size: 12px; }
    .status-offline { color: #888; font-size: 12px; }
    .section-title { font-weight: bold; font-size: 12px; margin: 12px 0 6px 0; color: #6c757d; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
    .msg { margin: 6px 0; line-height: 1.4; }
    .msg.me { text-align: right; color: #0d6efd; }
    .msg.them { text-align: left; color: #212529; }
    .msg-sender { font-weight: bold; font-size: 12px; display: block; color: #495057; }
    .row { display: flex; gap: 6px; }
    input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #adb5bd; background: #e9ecef; }
    button:hover { background: #dee2e6; }
    
    /* Group Modal */
    #modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
    #modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 340px; }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div id="login-panel" style="margin-bottom: 20px;">
    <input type="text" id="username-input" placeholder="Enter username..." />
    <button onclick="login()">Log In</button>
  </div>

  <!-- Main App Layout -->
  <div id="app" class="hidden">
    <!-- Sidebar -->
    <div id="sidebar">
      <div><strong>Logged in as: <span id="current-user-label"></span></strong></div>

      <div class="section-title">Add Friend</div>
      <div class="row">
        <input type="text" id="target-username" placeholder="Username" style="width: 100%;" />
        <button onclick="sendFriendRequest()">Add</button>
      </div>

      <div class="section-title">Friend Requests</div>
      <div id="requests-list"></div>

      <div class="section-title">
        <span>Groups</span>
        <button onclick="openGroupModal()" style="font-size: 11px; padding: 2px 6px;">+ New</button>
      </div>
      <div id="groups-list" style="max-height: 120px; overflow-y: auto;"></div>

      <div class="section-title">Direct Messages</div>
      <div id="friends-list" style="overflow-y: auto; flex-grow: 1;"></div>
    </div>

    <!-- Main Chat Window -->
    <div id="main-chat">
      <h3 id="chat-header" style="margin-top: 0;">Select a conversation</h3>
      <div id="chat-box"></div>
      <div class="row">
        <input type="text" id="message-input" placeholder="Type a message..." style="flex-grow: 1;" disabled />
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
      </div>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div id="modal" class="hidden">
    <div id="modal-content">
      <h3>Create New Group</h3>
      <input type="text" id="group-name-input" placeholder="Group Name" style="width: 100%; margin-bottom: 12px;" />
      <div style="font-weight: bold; margin-bottom: 6px; font-size: 13px;">Add Friends:</div>
      <div id="group-friends-checklist" style="max-height: 120px; overflow-y: auto; margin-bottom: 14px;"></div>
      <div class="row" style="justify-content: flex-end;">
        <button onclick="closeGroupModal()">Cancel</button>
        <button onclick="createGroup()" style="background: #0d6efd; color: #fff; border-color: #0d6efd;">Create</button>
      </div>
    </div>
  </div>

  <script>
    let socket = null;
    let currentUser = "";
    let activeChat = null; // { type: 'direct' | 'group', id: string | number, name: string }
    let currentFriends = [];

    function login() {
      const input = document.getElementById("username-input");
      currentUser = input.value.trim();
      if (!currentUser) return;

      socket = new WebSocket("ws://127.0.0.1:8765");

      socket.onopen = () => {
        socket.send(JSON.stringify({ action: "login", username: currentUser }));
        document.getElementById("login-panel").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        document.getElementById("current-user-label").textContent = currentUser;
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.action === "dashboard_sync") {
          currentFriends = data.friends;
          renderDashboard(data.friends, data.requests, data.groups);
        } else if (data.action === "alert") {
          alert(data.text);
        } else if (data.action === "chat_history") {
          renderChatHistory(data.history);
        } else if (data.action === "new_message") {
          handleIncomingMessage(data);
        }
      };

      socket.onclose = () => alert("Disconnected from server.");
    }

    function renderDashboard(friends, requests, groups) {
      // Pending Requests
      const reqList = document.getElementById("requests-list");
      reqList.innerHTML = requests.length ? "" : "<small style='color:#888'>None</small>";
      requests.forEach(sender => {
        const div = document.createElement("div");
        div.style = "display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px;";
        div.innerHTML = `<span>${sender}</span> <button onclick="acceptRequest('${sender}')">Accept</button>`;
        reqList.appendChild(div);
      });

      // Groups List
      const gList = document.getElementById("groups-list");
      gList.innerHTML = groups.length ? "" : "<small style='color:#888'>No groups yet</small>";
      groups.forEach(g => {
        const div = document.createElement("div");
        const isActive = activeChat && activeChat.type === "group" && activeChat.id === g.id;
        div.className = `list-item ${isActive ? 'active' : ''}`;
        div.textContent = `# ${g.name}`;
        div.onclick = () => selectChat("group", g.id, g.name);
        gList.appendChild(div);
      });

      // Friends List
      const fList = document.getElementById("friends-list");
      fList.innerHTML = friends.length ? "" : "<small style='color:#888'>No friends added</small>";
      friends.forEach(f => {
        const div = document.createElement("div");
        const isActive = activeChat && activeChat.type === "direct" && activeChat.id === f.username;
        div.className = `list-item ${isActive ? 'active' : ''}`;
        div.onclick = () => selectChat("direct", f.username, f.username);
        div.innerHTML = `
          <span>${f.username}</span>
          <span class="${f.online ? 'status-online' : 'status-offline'}">${f.online ? '● Online' : '○ Offline'}</span>
        `;
        fList.appendChild(div);
      });
    }

    function selectChat(type, id, name) {
      activeChat = { type, id, name };
      document.getElementById("chat-header").textContent = type === "group" ? `# ${name}` : `Chat with ${name}`;
      document.getElementById("message-input").disabled = false;
      document.getElementById("send-btn").disabled = false;
      
      // Refresh sidebar highlighting
      renderDashboard(currentFriends, [], []); 

      socket.send(JSON.stringify({
        action: "load_chat",
        chat_type: type,
        target_id: id
      }));
    }

    function renderChatHistory(messages) {
      const box = document.getElementById("chat-box");
      box.innerHTML = "";
      messages.forEach(m => appendMessage(m.sender, m.text));
    }

    function handleIncomingMessage(msg) {
      if (!activeChat) return;
      const isCurrentDirect = activeChat.type === "direct" && msg.chat_type === "direct" && activeChat.id === msg.target_id;
      const isCurrentGroup = activeChat.type === "group" && msg.chat_type === "group" && activeChat.id === msg.target_id;

      if (isCurrentDirect || isCurrentGroup) {
        appendMessage(msg.sender, msg.text);
      }
    }

    function appendMessage(sender, text) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = `msg ${sender === currentUser ? 'me' : 'them'}`;
      div.innerHTML = `<span class="msg-sender">${sender}</span>${text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (text && activeChat) {
        socket.send(JSON.stringify({
          action: "send_message",
          chat_type: activeChat.type,
          target_id: activeChat.id,
          text: text
        }));
        input.value = "";
      }
    }

    function sendFriendRequest() {
      const target = document.getElementById("target-username").value.trim();
      if (target) {
        socket.send(JSON.stringify({ action: "send_friend_request", to_user: target }));
        document.getElementById("target-username").value = "";
      }
    }

    function acceptRequest(fromUser) {
      socket.send(JSON.stringify({ action: "accept_friend_request", from_user: fromUser }));
    }

    // Modal Operations
    function openGroupModal() {
      const checklist = document.getElementById("group-friends-checklist");
      checklist.innerHTML = "";
      currentFriends.forEach(f => {
        const div = document.createElement("div");
        div.innerHTML = `<label><input type="checkbox" value="${f.username}" /> ${f.username}</label>`;
        checklist.appendChild(div);
      });
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeGroupModal() {
      document.getElementById("modal").classList.add("hidden");
      document.getElementById("group-name-input").value = "";
    }

    function createGroup() {
      const name = document.getElementById("group-name-input").value.trim();
      const checkboxes = document.querySelectorAll("#group-friends-checklist input[type='checkbox']:checked");
      const selected = Array.from(checkboxes).map(cb => cb.value);

      if (!name) {
        alert("Please enter a group name.");
        return;
      }

      socket.send(JSON.stringify({
        action: "create_group",
        name: name,
        members: selected
      }));
      closeGroupModal();
    }

    document.getElementById("message-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
