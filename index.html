<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python WebSocket Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 0 16px; }
    #chat-box { border: 1px solid #ccc; height: 350px; overflow-y: auto; padding: 10px; border-radius: 6px; background: #fafafa; }
    .msg { margin: 6px 0; }
    .system { color: #888; font-style: italic; }
    .user { font-weight: bold; }
    .row { margin-top: 10px; display: flex; gap: 8px; }
    input[type="text"] { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; cursor: pointer; border-radius: 4px; border: 1px solid #888; background: #eee; }
    button:hover { background: #ddd; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h2>Real-Time Chat</h2>

  <!-- Login Section -->
  <div id="login-section" class="row">
    <input type="text" id="username-input" placeholder="Enter your display name..." />
    <button id="join-btn">Join Chat</button>
  </div>

  <!-- Chat Section (Shown after joining) -->
  <div id="chat-section" class="hidden">
    <div id="chat-box"></div>
    <div class="row">
      <input type="text" id="message-input" placeholder="Type a message..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    let socket = null;
    let username = "";

    const loginSection = document.getElementById("login-section");
    const chatSection = document.getElementById("chat-section");
    const usernameInput = document.getElementById("username-input");
    const joinBtn = document.getElementById("join-btn");
    const chatBox = document.getElementById("chat-box");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(text, className = "") {
      const el = document.createElement("div");
      el.className = `msg ${className}`;
      el.textContent = text;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function connect() {
      username = usernameInput.value.trim() || "Guest";

      // Hide login, reveal chat room
      loginSection.classList.add("hidden");
      chatSection.classList.remove("hidden");

      socket = new WebSocket("ws://127.0.0.1:8765");

      socket.onopen = () => {
        socket.send(JSON.stringify({ username }));
        messageInput.focus();
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "system") {
          appendMessage(data.text, "system");
        } else if (data.type === "chat") {
          appendMessage(`${data.username}: ${data.text}`);
        }
      };

      socket.onclose = () => {
        appendMessage("Disconnected from server. Check if server.py is running.", "system");
        messageInput.disabled = true;
        sendBtn.disabled = true;
      };

      socket.onerror = (err) => {
        appendMessage("Connection error occurred.", "system");
      };
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text && socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ text }));
        messageInput.value = "";
      }
    }

    joinBtn.addEventListener("click", connect);
    usernameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") connect();
    });

    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
